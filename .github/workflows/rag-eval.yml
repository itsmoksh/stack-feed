name: RAG Evaluation Suite

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rag-eval:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Select trusted baseline
        id: baseline
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$GITHUB_BASE_REF"
            git show FETCH_HEAD:evals/baseline.json > /tmp/rag-baseline.json
            echo "path=/tmp/rag-baseline.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=evals/baseline.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RAG evaluation suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
          LANGSMITH_PROJECT: stack-feed-rag-evals
        run: uv run python evals/run_suite.py --output evals/results/pr_report.json

      - name: Compare evaluation with baseline
        env:
          BASELINE_PATH: ${{ steps.baseline.outputs.path }}
        run: uv run python evals/compare.py --baseline "$BASELINE_PATH" --report evals/results/pr_report.json

      - name: Upload evaluation report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-${{ github.run_number }}
          path: |
            evals/results/*.json
            stack_feed.log
          if-no-files-found: warn
          retention-days: 30
