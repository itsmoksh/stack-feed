name: Weekly AI Digest Bot

on:
  workflow_dispatch:

jobs:
  weekly-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Restore Gmail credentials
        shell: bash
        run: |
          mkdir -p fetcher
          echo "$GMAIL_CREDENTIALS_JSON_B64" | base64 -d > fetcher/gmail_credentials.json
          echo "$GMAIL_TOKEN_JSON_B64" | base64 -d > fetcher/token.json
        env:
          GMAIL_CREDENTIALS_JSON_B64: ${{ secrets.GMAIL_CREDENTIALS_JSON_B64 }}
          GMAIL_TOKEN_JSON_B64: ${{ secrets.GMAIL_TOKEN_JSON_B64 }}

      - name: Run weekly bot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DIGEST_CHANNEL_ID: ${{ secrets.DIGEST_CHANNEL_ID }}
          METRICS_CHANNEL_ID: ${{ secrets.METRICS_CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: uv run python discord_bot.py

      - name: Upload logs
        if: always()  # runs even if bot fails
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_number }}
          path: stack_feed.log
          retention-days: 30
